services:
  - type: web
    name: devis-kitchen
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # set manually — the service-account JSON from the devis-kitchen-orders Firebase project
